<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Legal Contract Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(15, 23, 42, 0.95),
                    rgba(30, 41, 59, 0.90),
                    rgba(37, 99, 235, 0.75)
                );

            position: relative;
            overflow: hidden;
        }


        /* Background decorative circles */

        body::before {
            content: "";
            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background: rgba(59, 130, 246, 0.18);

            top: -150px;
            left: -150px;

            filter: blur(10px);
        }


        body::after {
            content: "";
            position: absolute;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(147, 197, 253, 0.15);

            bottom: -150px;
            right: -100px;

            filter: blur(10px);
        }


        /* Login Container */

        .login-container {

            width: 420px;

            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 18px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            position: relative;

            z-index: 1;

            animation: fadeIn 0.7s ease;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* Logo */

        .logo {

            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            color: white;

            background:
                linear-gradient(135deg, #2563eb, #1e40af);

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.35);
        }


        h1 {

            text-align: center;

            font-size: 25px;

            color: #0f172a;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* Form */

        .input-group {

            margin-bottom: 20px;

            position: relative;
        }


        label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            color: #334155;

            margin-bottom: 8px;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;
        }


        input {

            width: 100%;

            padding: 14px 45px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;

            background: #f8fafc;
        }


        input:focus {

            border-color: #2563eb;

            background: white;

            box-shadow:
                0 0 0 4px rgba(37, 99, 235, 0.12);
        }


        .toggle-password {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;
        }


        /* Login Button */

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;

            color: white;

            background:
                linear-gradient(135deg, #2563eb, #1d4ed8);

            transition: 0.3s;

            margin-top: 5px;
        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 20px rgba(37, 99, 235, 0.35);
        }


        /* Error */

        #message {

            text-align: center;

            margin-top: 18px;

            font-size: 14px;

            font-weight: 500;
        }


        /* Footer */

        .footer {

            text-align: center;

            margin-top: 28px;

            font-size: 12px;

            color: #94a3b8;
        }


        @media(max-width: 500px) {

            .login-container {

                width: 90%;

                padding: 35px 25px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="logo">
        ⚖️
    </div>


    <h1>Welcome Back</h1>

    <p class="subtitle">
        Sign in to access your Legal Contract Management System
    </p>


    <form id="loginForm">


        <!-- Username -->

        <div class="input-group">

            <label>Username</label>

            <div class="input-wrapper">

                <span class="input-icon">👤</span>

                <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                >

            </div>

        </div>


        <!-- Password -->

        <div class="input-group">

            <label>Password</label>

            <div class="input-wrapper">

                <span class="input-icon">🔒</span>

                <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                >

                <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        aria-label="Toggle password visibility"
                >
                    <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    >
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>

            </div>

        </div>


        <button type="submit" class="login-btn">
            Sign In →
        </button>


    </form>


    <div id="message"></div>


    <div class="footer">
        © 2026 Legal Contract Management System
    </div>


</div>


<script>

    function togglePassword() {

    const password = document.getElementById("password");
    const eyeButton = document.querySelector(".toggle-password");

    if (password.type === "password") {

        password.type = "text";

        eyeButton.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M1 1l22 22"/>
                <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24"/>
                <path d="M14.12 14.12A3 3 0 0 0 9.88 9.88"/>
                <path d="M14.93 5.08A10.94 10.94 0 0 1 22 12s-1.5 3-4.06 5.06"/>
            </svg>
        `;

    } else {

        password.type = "password";

        eyeButton.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="20"
                 height="20"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        `;
    }
}


    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event)
        {

            event.preventDefault();


            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;


            const response = await fetch(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                }
            );


            const message =
                document.getElementById("message");


            if (response.ok)
            {
                localStorage.clear();

                const result =
                    await response.text();


                /*
                    Backend response:
                    Login successful! Role: ADMIN
                    Login successful! Role: USER
                */

                const role =
                    result.includes("ADMIN")
                        ? "ADMIN"
                        : "USER";


                localStorage.setItem(
                    "username",
                    username
                );


                localStorage.setItem(
                    "role",
                    role
                );

                message.style.color = "green";

                message.innerText =
                    "Login successful! Redirecting...";


                setTimeout(() =>
                {
                    window.location.href =
                        "/Dashboard.html";
                }, 700);

            }

            else
            {

                message.style.color = "#dc2626";

                message.innerText =
                    "Invalid username or password.";

            }

        });

</script>


</body>
</html>
