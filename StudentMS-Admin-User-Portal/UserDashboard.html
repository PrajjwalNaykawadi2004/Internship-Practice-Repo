<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard</title>

    <link rel="stylesheet" href="UserDashboard.css">

</head>

<body>

<div class="sidebar">

    <h2>🎓 Student Portal</h2>

    <ul>

        <li>
            <a href="UserDashboard.html">
                🏠 Dashboard
            </a>
        </li>


        <li>
            <a href="Profile.html">
                👤 My Profile
            </a>
        </li>


        <li>
            <a href="#">
                📚 My Details
            </a>
        </li>


        <li>
            <a href="#" onclick="logout()">
                🚪 Logout
            </a>
        </li>

    </ul>

</div>

<div class="main">

    <div class="topbar">

        <h2>User Dashboard</h2>

        <div class="user-info">

            <img id="dashboardProfileImage"
                 src="images/default-user.png"
                 alt="Profile"
                 onclick="window.location.href='Profile.html'">

            <span id="username">
            Welcome User
        </span>

        </div>

    </div>

    <div class="cards">

        <div class="card">

            <h3>My Profile</h3>

            <p id="profileName">
                User
            </p>

        </div>

        <div class="card">

            <h3>Status</h3>

            <p style="color:green;">
                Active
            </p>

        </div>

        <div class="card">

            <h3>Role</h3>

            <p>
                USER
            </p>

        </div>


    </div>


    <div class="table-container">


        <h2>
            My Information
        </h2>


        <table>


            <thead>

            <tr>

                <th>
                    Username
                </th>


                <th>
                    Role
                </th>


                <th>
                    Status
                </th>


                <th>
                    Created Date
                </th>


            </tr>

            </thead>

            <tbody id="userTable">

            </tbody>

        </table>

    </div>

</div>

<script src="UserDashboard.js"></script>

</body>

</html>
