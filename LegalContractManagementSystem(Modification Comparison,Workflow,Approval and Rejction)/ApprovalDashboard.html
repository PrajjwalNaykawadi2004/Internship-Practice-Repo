<!DOCTYPE html>

<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        .navbar {
            height: 60px;
            background: #1f2937;
            color: white;

<body>

<div class="navbar">
    <h2>Legal Contract Management</h2>

    <div class="user-info">
        <span id="currentUser"></span>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="layout">

    <div class="sidebar">

        <a href="/Dashboard.html">
            Dashboard
        </a>

        <a href="/ApprovalDashboard.html" class="active">
            Approvals
        </a>

    </div>

    <div class="main">

        <div class="page-header">
            <h1>Approval Dashboard</h1>
            <button class="add-btn" onclick="openCreateModal()">
                + Request Approval
            </button>
        </div>

        <div class="stats">

            <div class="stat-card">
                <h3>Total Approvals</h3>
                <p id="totalApprovals">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingApprovals">0</p>
            </div>

            <div class="stat-card">
                <h3>Approved</h3>
                <p id="approvedApprovals">0</p>
            </div>

            <div class="stat-card">
                <h3>Rejected</h3>
                <p id="rejectedApprovals">0</p>
            </div>

        </div>

        <div class="table-container">

            <div class="table-toolbar">
                <h2>All Approvals</h2>

                <input
                        type="text"
                        id="searchApprovals"
                        placeholder="Search approvals..."
                        oninput="searchApprovals()"
                >
            </div>

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Contract</th>
                    <th>Version</th>
                    <th>Status</th>
                    <th>Comments</th>
                    <th>Reviewed By</th>
                    <th>Requested Date</th>
                    <th>Reviewed Date</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="approvalTableBody">
                </tbody>

            </table>

            <div id="emptyMessage" class="empty-message" style="display:none;">
                No approvals found.
            </div>

    </div>

<!-- Approval Modal -->

<div class="modal" id="approvalModal">

    <div class="modal-content">

            </button>

            <input type="number" id="versionId" placeholder="Enter Version ID">
        </div>

<script>

    document.addEventListener("DOMContentLoaded", function () {
    const username = localStorage.getItem("username");
    const role = localStorage.getItem("role");
    const justLoggedIn = sessionStorage.getItem("justLoggedIn");


    if (!username || justLoggedIn !== "true") {

        sessionStorage.setItem(
            "redirectAfterLogin",
            "/ApprovalDashboard.html"
        );

        window.location.replace("/Login.html");
        return;
    }

    sessionStorage.removeItem("justLoggedIn");

    document.getElementById("currentUser").textContent =
        username + " (" + role + ")";

    // Load approvals

    function loadApprovals() {

          fetch(
                "/api/approvals?username=" +
                encodeURIComponent(username)
            )
            .then(response => {

                if (!response.ok) {
                    throw new Error("Failed to load approvals");
                }

                return response.json();
            })
            .then(data => {

                console.log("APPROVAL DATA =", data);

                displayApprovals(data);
                updateStats(data);

            })
            .catch(error => {

                console.error(error);

                alert("Failed to load approvals.");

            });
    }


    // Display approvals

    function displayApprovals(approvals) {

        // approvals = approvals.filter(approval => approval.modification != null);

        const tbody =
            document.getElementById("approvalTableBody");

        const emptyMessage =
            document.getElementById("emptyMessage");

        tbody.innerHTML = "";

        if (!approvals || approvals.length === 0) {

            emptyMessage.style.display = "block";

            return;
        }

        emptyMessage.style.display = "none";


        approvals.forEach(approval => {

            const row = document.createElement("tr");

            const status =
                approval.status || "PENDING";

            let statusClass = "pending";

            if (status === "APPROVED") {
                statusClass = "approved";
            }

            if (status === "REJECTED") {
                statusClass = "rejected";
            }


            const contractId =
                approval.contract?.id ?? "-";

            const versionId =
                approval.version?.id ?? "-";

            const reviewedBy =
                approval.reviewedBy?.username ?? "-";


            row.innerHTML = `

                <td>${approval.id}</td>

                <td>Contract #${contractId}</td>

                <td>Version #${versionId}</td>

                <td>
                    <span class="status ${statusClass}">
                        ${status}
                    </span>
                </td>

                <td>${escapeHtml(approval.comments || "-")}</td>

                <td>${escapeHtml(reviewedBy)}</td>

                <td>${formatDate(approval.requestedAt)}</td>

                <td>${formatDate(approval.reviewedAt)}</td>

                <td>

                    <button
                        class="action-btn view-btn"
                        onclick="viewApproval(${approval.id})">
                        View
                    </button>

                    ${
                        role.trim().toUpperCase() === "CONTRACTMANAGER"
                        ? `
                            <button
                                class="action-btn edit-btn"
                                onclick="editApproval(${approval.id})">
                                Review
                            </button>

                            <button
                                class="action-btn delete-btn"
                                onclick="deleteApproval(${approval.id})">
                                Delete
                            </button>
                          `
                        : ""
                    }

                </td>
            `;

            tbody.appendChild(row);

        });

    }

    function searchApprovals() {

    const searchText =
        document.getElementById("searchApprovals")
            .value
            .toLowerCase()
            .trim();

    const rows =
        document.querySelectorAll("#approvalTableBody tr");

    rows.forEach(row => {

        const rowText =
            row.textContent.toLowerCase();

        row.style.display =
            rowText.includes(searchText)
                ? ""
                : "none";
    });
}


    // Statistics

    function updateStats(approvals) {

        const total = approvals.length;

        const pending =
            approvals.filter(a => a.status === "PENDING").length;

        const approved =
            approvals.filter(a => a.status === "APPROVED").length;

        const rejected =
            approvals.filter(a => a.status === "REJECTED").length;


        document.getElementById("totalApprovals").textContent =
            total;

        document.getElementById("pendingApprovals").textContent =
            pending;

        document.getElementById("approvedApprovals").textContent =
            approved;

        document.getElementById("rejectedApprovals").textContent =
            rejected;
    }


    // Open Create Modal

    function openCreateModal() {

        document.getElementById("modalTitle").textContent =
            "Request Approval";

        document.getElementById("approvalId").value = "";

        document.getElementById("contractId").value = "";

        document.getElementById("versionId").value = "";

        document.getElementById("status").value = "PENDING";

        if (role === "USER") {
            document.getElementById("status").value = "PENDING";
            document.getElementById("status").disabled = true;
        } else {
            document.getElementById("status").disabled = false;
        }

        document.getElementById("ApprovalComments").value = "";

        document.getElementById("reviewedBy").value = "";

        document.getElementById("approvalModal").style.display =
            "flex";
    }


    // Edit / Review Approval

    function editApproval(id) {

        fetch("/api/approvals/" + id)

            .then(response => {

                if (!response.ok) {
                    throw new Error("Approval not found");
                }

                return response.json();

            })

            .then(approval => {

                document.getElementById("modalTitle").textContent =
                    approval.status === "PENDING"
                        ? "Review Approval"
                        : "Edit Approval";

                document.getElementById("approvalId").value =
                    approval.id;

                document.getElementById("contractId").value =
                    approval.contract?.id || "";

                document.getElementById("versionId").value =
                    approval.version?.id || "";

                document.getElementById("status").value =
                    approval.status || "PENDING";

                document.getElementById("ApprovalComments").value =
                    approval.comments || "";

                document.getElementById("reviewedBy").value =
                    username;

                document.getElementById("approvalModal").style.display =
                    "flex";

            })

            .catch(error => {

                console.error(error);
                alert("Failed to load approval.");

            });
    }


    // Save Approval

    function saveApproval() {

        const id =
            document.getElementById("approvalId").value;

        const contractId =
            document.getElementById("contractId").value;

        const versionId =
            document.getElementById("versionId").value;

        const status =
            document.getElementById("status").value;

        console.log("SELECTED STATUS =", status);

        const comments =
            document.getElementById("ApprovalComments").value;

        if (!contractId || !versionId) {

            alert("Please enter Contract ID and Version ID.");

            return;
        }


        const approvalData = {

            status: status,

            comments: comments,

            requestedBy: {
                username: username
            },

            contract: {
                id: Number(contractId)
            },

            version: {
                id: Number(versionId)
            }
        };


        // For update, send reviewedBy

        if (id) {

            approvalData.reviewedBy = {
                username: username
            };

        }


        const url =
            id
                ? "/api/approvals/" + id
                : "/api/approvals";

        const method =
            id ? "PUT" : "POST";


        fetch(url, {

            method: method,

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(approvalData)

        })

        .then(response => {

            if (!response.ok) {
                return response.text().then(text => {
                    throw new Error(text);
                });
            }

            return response.json();

        })

        .then(() => {

            alert(
                id
                    ? "Approval updated successfully!"
                    : "Approval request created successfully!"
            );

            closeModal();

            loadApprovals();

        })

        .catch(error => {

            console.error(error);

            alert(
                "Failed to save approval: " +
                error.message
            );

        });

    }


    async function viewApproval(id) {

    try {

        const response =
            await fetch(`/api/approvals/${id}`);

        if (!response.ok) {

            alert("Approval not found.");
            return;

        }

        const approval =
            await response.json();

        const status =
            String(approval.status || "").toUpperCase();

        let statusClass = "pending";

        if (status === "APPROVED") {
            statusClass = "approved";
        }

        if (status === "REJECTED") {
            statusClass = "rejected";
        }

        document.getElementById("approvalDetails").innerHTML = `

            <div class="approval-detail-item">

                <span class="approval-detail-label">
                    Approval ID
                </span>

                <span class="approval-detail-value">
                    #${approval.id ?? "-"}
                </span>

            </div>

            <div class="approval-detail-item">
    <span class="approval-detail-label">Modification ID</span>
    <span class="approval-detail-value">
        ${approval.modification?.id ?? "-"}
    </span>
            </div>

            <div class="approval-detail-item">
                <span class="approval-detail-label">Original Value</span>
                <span class="approval-detail-value">
                    ${escapeHtml(approval.modification?.oldContent || "-")}
                </span>
            </div>

            <div class="approval-detail-item">
                <span class="approval-detail-label">Proposed Value</span>
                <span class="approval-detail-value">
                    ${escapeHtml(approval.modification?.newContent || "-")}
                </span>
            </div>

            <div class="approval-detail-item">
                <span class="approval-detail-label">Modification Reason</span>
                <span class="approval-detail-value">
                    ${escapeHtml(approval.modification?.reason || "-")}
                </span>
            </div>

            <div class="approval-detail-item">
                <span class="approval-detail-label">Requested By</span>
                <span class="approval-detail-value">
                    ${escapeHtml(approval.requestedBy?.username || "-")}
                </span>
            </div>

            <div class="approval-detail-item">
                <span class="approval-detail-label">Request Date</span>
                <span class="approval-detail-value">
                    ${approval.requestedAt ? formatDate(approval.requestedAt) : "-"}
                </span>
            </div>

            <div class="approval-detail-item">
                <span class="approval-detail-label">Current Status</span>
                <span class="approval-view-status ${statusClass}">
                    ${escapeHtml(
                        approval.modification?.status ||
                        approval.status ||
                        "-"
                    )}
                </span>
            </div>

            <div class="approval-detail-item">

                <span class="approval-detail-label">
                    Status
                </span>

                <span class="approval-view-status ${statusClass}">
                    ${escapeHtml(status || "-")}
                </span>

            </div>


            <div class="approval-detail-item">

                <span class="approval-detail-label">
                    Contract ID
                </span>

                <span class="approval-detail-value">
                    ${approval.contract?.id ?? "-"}
                </span>

            </div>


            <div class="approval-detail-item">

                <span class="approval-detail-label">
                    Version ID
                </span>

                <span class="approval-detail-value">
                    ${approval.version?.id ?? "-"}
                </span>

            </div>


            <div class="approval-detail-item">

                <span class="approval-detail-label">
                    Requested By
                </span>

                <span class="approval-detail-value">
                    ${escapeHtml(
                        approval.requestedBy?.username || "-"
                    )}
                </span>

            </div>


            <div class="approval-detail-item">

                <span class="approval-detail-label">
                    Reviewed By
                </span>

                <span class="approval-detail-value">
                    ${escapeHtml(
                        approval.reviewedBy?.username || "-"
                    )}
                </span>

            </div>


            <div class="approval-detail-item">

                <span class="approval-detail-label">
                    Requested At
                </span>

                <span class="approval-detail-value">
                    ${
                        approval.requestedAt
                        ? formatDate(approval.requestedAt)
                        : "-"
                    }
                </span>

            </div>


            <div class="approval-detail-item">

                <span class="approval-detail-label">
                    Reviewed At
                </span>

                <span class="approval-detail-value">
                    ${
                        approval.reviewedAt
                        ? formatDate(approval.reviewedAt)
                        : "-"
                    }
                </span>

            </div>


            <div class="approval-detail-item approval-full-width">

                <span class="approval-detail-label">
                    Comments
                </span>

                <div class="approval-comments-box">${escapeHtml(approval.comments || "-")}</div>

            </div>

        `;

        document.getElementById(
            "viewApprovalModal"
        ).style.display = "flex";


    } catch (error) {

        console.error(
            "View approval error:",
            error
        );

        alert("Unable to view approval.");

    }

}

    // Delete Approval

    function deleteApproval(id) {

        if (!confirm(
            "Are you sure you want to delete this approval?"
        )) {
            return;
        }


        fetch("/api/approvals/" + id, {

            method: "DELETE"

        })

        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to delete approval");
            }

            alert("Approval deleted successfully!");

            loadApprovals();

        })

        .catch(error => {

            console.error(error);

            alert("Failed to delete approval.");

        });

    }


    // Close Modal

    function closeModal() {

        document.getElementById("approvalModal").style.display =
            "none";
    }

    // Close View Modal

    function closeApprovalViewModal() {

        document.getElementById(
            "viewApprovalModal"
        ).style.display = "none";

    }


    // Logout

    function logout() {

        localStorage.removeItem("username");
        localStorage.removeItem("role");
        localStorage.removeItem("adminPassword");

        window.location.href = "/Login.html";
    }


    // Format date

    function formatDate(date) {

        if (!date) {
            return "-";
        }

        return new Date(date).toLocaleString();
    }


    // Escape HTML

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // Initial load

    window.openCreateModal = openCreateModal;
    window.editApproval = editApproval;
    window.saveApproval = saveApproval;
    window.viewApproval = viewApproval;
    window.deleteApproval = deleteApproval;
    window.closeModal = closeModal;
    window.closeApprovalViewModal =
    closeApprovalViewModal;
    window.searchApprovals = searchApprovals;
    window.logout = logout;

    loadApprovals();

    });

</script>
